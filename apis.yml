apis:
- aid: inductive-automation:ignition-gateway-rest-api
  name: Ignition Gateway REST API
  description: >-
    The Ignition Gateway REST API (available in Ignition 8.3+) provides an OpenAPI- compliant HTTP interface
    to Gateway configuration resources including tags, projects, modules, device connections, and historian
    data. The API spec is dynamically generated and includes all routes exposed by installed modules.
    Authentication uses API keys with time-limited tokens. Mutative requests are audit-logged. Supports
    Kubernetes and Helm-based cloud-native deployments.
  humanURL: https://www.docs.inductiveautomation.com/docs/8.3/platform/gateway/openapi
  baseURL: https://{gateway-host}:8088/api
